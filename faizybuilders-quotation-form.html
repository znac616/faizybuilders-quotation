<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Construction Request Form | Faizy Builders</title>

<style>

body{
    font-family:Arial,sans-serif;
    font-size:16px;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

form{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:8px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

select,
input[type="text"],
input[type="tel"],
input[type="email"],
textarea{

    width:100%;
    padding:12px;
    font-size:16px;
    font-family:Arial,sans-serif;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
    -webkit-appearance:none;
    appearance:none;
}

textarea{
    resize:vertical;
}

button[type="button"],
button[type="submit"]{

    background:#0d6efd;
    color:white;
    border:none;
    padding:12px 20px;
    font-size:16px;
    font-weight:bold;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
    margin-right:8px;

}

button:hover{

    background:#0b5ed7;

}

#selected-work{

    margin-top:20px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:5px;
    background:#f8f9fa;

}

#subtype-checkbox label{

    display:block;
    font-weight:normal;
    margin-top:6px;

}

@media(max-width:768px){

form{

padding:18px;

}

}

</style>

<script>

const constructionOptions={

'Roofing':['Roof Guttering Services, metal, plastic, Cast Iron','Natural Slate work','Roof Leak Repairs','Chimney Repairs','Conservatory Roof','Cowling','Flat Roofing'],

'Carpentry':['Decking','Stairs','Doors and Door Frames','Wooden Floors','Garden Fence'],

'Construction':['Refurbishment','House Extension','Building Conversions','Basement Conversions','Bricklayers','Repointing','Building Renovations','Wall Rendering','Plasterboard Installation'],

'Floor':['Hardwood Flooring','Tile Flooring','Laminate Flooring','Stone/Concrete Flooring','Solid Timber Flooring','New Floor Installation'],

'Tiling':['Ceramic Tiling','Porcelain Tiling','Glass Tiling'],

'Electric Work':['Electric Work'],

'Wood Work':['Rails/Handrails','Door Hanging/Fitting','Wooden Decking','Wooden Flooring'],

'Plumbing':['Pipe Installation','Fixture Repairs','Water Heater Installation','Bath Plumbing','Central Heating System','Leaking Pipes','Under Floor Heating','Household Appliances','Water Heating System','Blocked Showers','Blocked Baths','Blocked Toilets','Gas Boiler Installation','Replacement of Water Heater','Replacement of Water Supply System'],

'Kitchen':['Kitchen Fitting','Worktop Installation','Installation of Glass Stand','Glass Splash-back Installation','Installation of Kitchen Appliances','Assembly of Kitchen Furniture','Installation of Sockets and Switches','Kitchen Laying Tiles','Kitchen Walls','Kitchen Ceiling','Installation of Ventilation System','Installing Water Filtration System','Installation and Connection of Dishwasher','Connecting and Setting Ovens and Hobs','Kitchen Remodeling','Cabinet Installation','Countertop Replacement'],

'Bathroom':['Bathroom Renovation','Tub and Shower Installation','Tile Work','Bath Installation','Washbasin Installation','Installation of Heated Towel Rail','Mirror Installation','Installing Shower Curtains'],

'Doors':['Door Installation','Door Repair','Door Hinge Repair'],

'Painting':['Interior Painting','Exterior Painting','Decorative Painting']

};

let selectedWorkItems=[];

function updateSubtypes(){

const selectedConstructionType=document.getElementById('construction-type').value;

const subtypes=constructionOptions[selectedConstructionType]||[];

const subtypeCheckbox=document.getElementById('subtype-checkbox');

subtypeCheckbox.innerHTML='';

for(const subtype of subtypes){

const label=document.createElement('label');

const input=document.createElement('input');

input.type='checkbox';

input.name='selected-subtypes[]';

input.value=subtype;

label.appendChild(input);

label.appendChild(document.createTextNode(" "+subtype));

subtypeCheckbox.appendChild(label);

}

}
function addSelectedWork(){

const selectedSubtypes=Array.from(
document.querySelectorAll('input[name="selected-subtypes[]"]:checked')
).map(c=>c.value);

selectedSubtypes.forEach(item=>{

if(!selectedWorkItems.includes(item)){

selectedWorkItems.push(item);

}

});

document.querySelectorAll('input[name="selected-subtypes[]"]').forEach(c=>{

c.checked=false;

});

displaySelectedWork();

}

});

document.querySelectorAll('input[name="selected-subtypes[]"]').forEach(c=>{

c.checked=false;

});

displaySelectedWork();

}

}

function displaySelectedWork(){

const selectedWorkBox=document.getElementById('selected-work');

selectedWorkBox.innerHTML="<label>Selected Work:</label>";

selectedWorkItems.forEach(item=>{

const div=document.createElement('div');

div.textContent="✓ "+item;

selectedWorkBox.appendChild(div);

});

document.getElementById("selected-work-input").value=selectedWorkItems.join(", ");

}

function cancelLastSelectedWork(){

selectedWorkItems.pop();

displaySelectedWork();

}

</script>

</head>

<body>

<h2>Construction Request Form</h2>

<form class="row g-3" action="https://formsubmit.co/faizybuildersuk@gmail.com" method="POST">

<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_subject" value="New Construction Quote">
<input type="hidden" name="Selected Work" id="selected-work-input">

<label>Select Construction Type</label>

<select id="construction-type" onchange="updateSubtypes()">

<option value="">Select...</option>
<option value="Roofing">Roofing</option>
<option value="Carpentry">Carpentry</option>
<option value="Floor">Floor</option>
<option value="Tiling">Tiling</option>
<option value="Wood Work">Wood Work</option>
<option value="Plumbing">Plumbing</option>
<option value="Kitchen">Kitchen</option>
<option value="Bathroom">Bathroom</option>
<option value="Doors">Doors</option>
<option value="Electric Work">Electric Work</option>
<option value="Painting">Painting</option>
<option value="Construction">Construction</option>

</select>

<div id="subtype-checkbox"></div>

<button type="button" onclick="addSelectedWork()">Add to Selected Work</button>

<button type="button" onclick="cancelLastSelectedWork()">Cancel</button>

<div id="selected-work">

<label>Selected Work:</label>

</div>
<label for="first-name">First Name:</label>
<input type="text" id="first-name" name="First Name" required>

<label for="last-name">Last Name:</label>
<input type="text" id="last-name" name="Last Name" required>

<label for="phone">Phone:</label>
<input type="tel" id="phone" name="Phone" required>

<label for="email">Email:</label>
<input type="email" id="email" name="Email" required>

<label for="post-code">Post Code:</label>
<input type="text" id="post-code" name="Postcode" required>

<label for="message">Project Details:</label>
<textarea id="message"
          name="Project Details"
          rows="5"
          placeholder="Please describe your project..."></textarea>

<button type="submit">Request Free Quotation</button>

</form>

<script>

// Show Roofing options automatically when page loads
window.onload=function(){
    updateSubtypes();
};

</script>

</body>
</html>
