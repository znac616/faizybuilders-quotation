<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction Request Form</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-62XELEKH1N"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config','G-62XELEKH1N');

const constructionOptions={
'Roofing':['Roof Guttering Services, metal, plastic, Cast Iron','Natural Slate work','Roof Leak Repairs','Chimney Repairs','Conservatory Roof','Cowling','Flat Roofing'],
'Carpentry':['Decking','Stairs','Doors and Door Frames','Wooden Floors','Garden Fence'],
'Construction':['Refurbishment','House Extension','Building Conversions','Basement Conversions','Bricklayers','Repointing','Building renovations','Wall Rendering','Plasterboard Installation'],
'Floor':['Hardwood Flooring','Tile Flooring','Laminate Flooring','Stone/Concrete Flooring','Solid Timber Flooring','New Floor Installation'],
'Tiling':['Ceramic Tiling','Porcelain Tiling','Glass Tiling'],
'Electric Work':['Electric Work'],
'Wood Work':['Rails/handrails','Door hanging/fitting','Wooden Decking','Wooden Flooring'],
'Plumbing':['Pipe Installation','Fixture Repairs','Water Heater Installation','Bath Plumbing','Central heating System','Leaking Pipes','Under Floor Heating','Household Appliances','Water Heating System','Blocked Showers','Blocked Baths','Blocked Toilets','Gas Boiler Installation','Replacement of water Heater','Replacement of Water Supply System'],
'Kitchen':['Kitchen Fitting','Worktop Installation','Installation of Glass stand','Glass Splash-back Installation','Installation of Kitchen Appliances','Assembly of kitchen Furniture','Installation of Sockets and switches','Kitchen laying Tiles','Kitchen walls','Kitchen Ceiling','Installation of Ventilation System','Installing Water Filtration system','Installation and connection of Dishwasher','Connecting and Setting Ovens and hobs','Kitchen Remodeling','Cabinet Installation','Countertop Replacement'],
'Bathroom':['Bathroom Renovation','Tub and Shower Installation','Tile Work','Bath Installation','Washbasin Installation','Installation of Heated Towel Rail','Mirror Installation','Installing Shower Curtains'],
'Doors':['Door Installation','Door Repair','Door Hinge Repair'],
'Painting':['Interior Painting','Exterior Painting','Decorative Painting']
};

function updateSubtypes(){
 const type=document.getElementById('construction-type').value;
 const box=document.getElementById('subtype-checkbox');
 box.innerHTML='';
 (constructionOptions[type]||[]).forEach(item=>{
   const label=document.createElement('label');
   const cb=document.createElement('input');
   cb.type='checkbox';
   cb.name='Subtypes';
   cb.value=item;
   label.appendChild(cb);
   label.appendChild(document.createTextNode(' '+item));
   box.appendChild(label);
   box.appendChild(document.createElement('br'));
 });
}

function beforeSubmit(){
 const selected=[...document.querySelectorAll('#subtype-checkbox input:checked')].map(x=>x.value);
 document.getElementById('selectedWork').value=selected.join(', ');
 return true;
}

window.onload=updateSubtypes;
</script>

<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;padding:20px;}
form{max-width:650px;margin:auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.15);}
label{display:block;margin-top:12px;font-weight:bold;}
input,select,textarea{width:100%;padding:10px;box-sizing:border-box;margin-top:5px;}
button{margin-top:20px;padding:12px 20px;background:#007bff;color:#fff;border:none;border-radius:5px;cursor:pointer;}
button:hover{background:#0056b3;}
</style>
</head>

<body>

<h2 style="text-align:center;">Construction Request Form</h2>

<form action="https://formsubmit.co/faizybuildersuk@gmail.com" method="POST" onsubmit="return beforeSubmit();">

<input type="hidden" name="_subject" value="New Construction Quote Request">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_next" value="https://faizybuilders.co.uk/">
<input type="hidden" id="selectedWork" name="Selected Work">

<label>Construction Type</label>
<select id="construction-type" name="Construction Type" onchange="updateSubtypes()">
<option>Roofing</option>
<option>Carpentry</option>
<option>Construction</option>
<option>Floor</option>
<option>Tiling</option>
<option>Electric Work</option>
<option>Wood Work</option>
<option>Plumbing</option>
<option>Kitchen</option>
<option>Bathroom</option>
<option>Doors</option>
<option>Painting</option>
</select>

<div id="subtype-checkbox"></div>

<label>First Name</label>
<input type="text" name="First Name" required>

<label>Last Name</label>
<input type="text" name="Last Name" required>

<label>Phone</label>
<input type="tel" name="Phone" required>

<label>Email</label>
<input type="email" name="Email" required>

<label>Post Code</label>
<input type="text" name="Post Code" required>

<label>Message</label>
<textarea name="Message" rows="5"></textarea>

<button type="submit">Submit Request</button>

</form>

</body>
</html>
